# =========================================================================
# Configuration d'Outil : Epée Lourde de Depart (heavy_sword)
# =========================================================================

# Identifiant unique de l'outil
id: "heavy_sword"

# Materiel Minecraft sous-jacent
material: "DIAMOND_SWORD"

# CustomModelData utilise pour changer la texture/modele 3D
custom-model-data: 10026

# Nom d'affichage de l'item
display-name: "<gradient:#FF9304:#FCF65D>Epée Lourde de Depart</gradient>"

# Description/Lore de l'outil
no-modifier-message: "&7 (Aucun modificateur)"
lore:
  - "&7Une épée tranchante qui évolue avec vous."
  - ""
  - "&eProgression :"
  - "&d - Niveau : &f{level}"
  - "&d - XP : &f{xp}/{max_xp}"
  - ""
  - "&eModificateurs ({slots_used}/{slots_total}) :"
  - "{modifiers_list}"

# Formule de courbe d'experience necessaire pour passer de niveau
xp-curve:
  base: 100
  multiplier: 1.5

# Configuration de l'XP et des drops par mob tué
mob-activities:
  DEFAULT: 5
  WITHER: 250
  ENDER_DRAGON: 500
  CHICKEN: 1

# Progression de l'outil
progression:
  # Niveau maximum
  max-level: 20
  
  # Slots de modificateurs debloques aux niveaux specifiques
  slots:
    5: 1
    10: 2
    15: 3
    20: 4
    
  # Nombre maximum de slots de modificateurs
  max-slots: 4

# Limites maximales des enchantements pour cet outil
enchantment-limits:
  SHARPNESS: 10
  UNBREAKING: 8
  FIRE_ASPECT: 3
  LOOTING: 5
  KNOCKBACK: 2

# Modificateurs autorises et niveau maximum
allowed-modifiers:
  wisdom: 3
  learning: 3
  unbreakable: 1
  bouncy: 3
  purify: 3
  beheading: 3
